[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidirectional-music-and-or-graph-parser"
version = "0.1.0"
description = "Bidirectional Music And-Or Graph Parser with MOSS-Music and MIR candidate fusion"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Bidirectional Music And-Or Graph Parser contributors" },
  { name = "OpenMOSS Team" },
]
dependencies = [
  "safetensors>=0.4.0",
  "numpy>=2.0",
  "soundfile>=0.12.0",
  "tiktoken>=0.12.0",
  "einops>=0.8.0",
  "scipy>=1.12.0",
  "tqdm>=4.60.0",
  "packaging",
  "gradio",
  "requests",
]

[project.optional-dependencies]
flash-attn = ["flash-attn"]

research = [
  "accelerate>=1.0",
  "librosa==1.0.0",
  "miditoolkit==1.0.1",
]

web = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1.0",
]

torch-runtime = [
  "accelerate",
  "torch==2.9.1+cu128",
  "torchaudio==2.9.1+cu128",
  "torchcodec==0.9.*",
  "transformers==4.57.1",
]

[project.urls]
Homepage = "https://github.com/dirftking/Bidirectional-Music-And-Or-Graph-Parser"
Repository = "https://github.com/dirftking/Bidirectional-Music-And-Or-Graph-Parser"
Upstream = "https://github.com/OpenMOSS/MOSS-Music"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "audio2musicaog", "audio2musicaog.*"]
